# Runs the tests on every push and pull request, on Linux and on native Windows.
#
# The Windows job exists because the server must start there (#24: the filesystem backend
# imported the Unix-only `fcntl`); `tests/server/test_filelock.py` exercises the `msvcrt`
# lock for real only on this runner. A test that needs something Windows lacks (POSIX mode
# bits, a POSIX bash) skips there and says why. The Neo4j backend tests skip (no `NEO4J_URI`).
#
# Relate, the engine a bundle is written in, is released on an internal GitHub repository, so it
# is installed by `scripts/install-relate.sh` with a token that can read it (the repository
# secret `RELATE_GH_TOKEN`). Without the secret the bundle tests skip and say so, and the
# fresh-venv proof (`scripts/fresh-venv.sh`) does not run.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RELATE_GH_TOKEN: ${{ secrets.RELATE_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the package
        run: uv sync --group dev

      - name: Install Relate
        if: runner.os == 'Linux' && env.RELATE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELATE_GH_TOKEN }}
        run: scripts/install-relate.sh .venv

      - name: Run the tests
        # The code under test names utf-8 on every text file it reads or writes; the tests' own
        # fixtures use the platform default, which on Windows is the ANSI code page. UTF-8 mode
        # (the default from Python 3.15) keeps the fixtures readable by the code.
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -q

      - name: The examples are in canonical form
        # A formatter change that moves the examples fails here, not in a user's CI: formatting a
        # procedure changes its bundle id, since the id hashes the source bytes.
        if: runner.os == 'Linux'
        run: uv run aip fmt --check examples/language

      - name: A fresh venv compiles an example (L3's proof)
        if: runner.os == 'Linux' && env.RELATE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELATE_GH_TOKEN }}
        run: scripts/fresh-venv.sh

  # The VS Code extension (E1's proof): esbuild bundles it, node's test runner tokenizes the
  # examples with vscode-textmate and checks a one-error fixture through `uv run aip`, which the
  # tests default to from a checkout. There is no lockfile, so `npm install` resolves the three
  # dev dependencies from their ranges.
  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the package
        run: uv sync --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test the extension
        working-directory: editors/vscode
        run: |
          npm install
          npm run build
          npm test
