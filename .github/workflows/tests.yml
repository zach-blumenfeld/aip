# Runs the tests on every push and pull request, on Linux and on native Windows.
#
# The Windows job exists because the client and the server must start there (#24). A test that
# needs something Windows lacks (POSIX mode bits, a POSIX bash) skips there and says why. The
# server's suite (`tests/server`) runs over the Relate backend where Relate is installed; its
# Neo4j half skips (no `NEO4J_URI`).
#
# Relate, the engine a bundle is written in, is released on an internal GitHub repository, so it
# is installed by `scripts/install-relate.sh` with a token that can read it (the repository
# secret `RELATE_GH_TOKEN`). Without the secret the bundle tests skip and say so, and the
# fresh-venv proof (`scripts/fresh-venv.sh`) does not run.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RELATE_GH_TOKEN: ${{ secrets.RELATE_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the package
        run: uv sync --group dev

      - name: Install Relate
        if: runner.os == 'Linux' && env.RELATE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELATE_GH_TOKEN }}
        run: scripts/install-relate.sh .venv

      - name: Run the tests
        # The code under test names utf-8 on every text file it reads or writes; the tests' own
        # fixtures use the platform default, which on Windows is the ANSI code page. UTF-8 mode
        # (the default from Python 3.15) keeps the fixtures readable by the code.
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -q

      - name: The examples are in canonical form
        # A formatter change that moves the examples fails here, not in a user's CI: formatting a
        # procedure changes its bundle id, since the id hashes the source bytes.
        if: runner.os == 'Linux'
        run: uv run aip fmt --check examples/language

      - name: A fresh venv compiles an example (L3's proof)
        if: runner.os == 'Linux' && env.RELATE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELATE_GH_TOKEN }}
        run: scripts/fresh-venv.sh

  # The VS Code extension (E1's and E2's proofs): esbuild bundles it and its graph preview (the
  # console's card canvas, from console/src/canvas), node's test runner tokenizes the examples with
  # vscode-textmate, checks a one-error fixture through `uv run aip`, which the tests default to
  # from a checkout, and renders the preview over the compiler's graph before and after a
  # `Next_Step` edit. There is no lockfile, so `npm install` resolves the dev dependencies from
  # their ranges.
  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the package
        run: uv sync --group dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test the extension
        working-directory: editors/vscode
        run: |
          npm install
          npm run build
          npm test

  # The console (`console/`, the npm package `aip-console`; plan C1): the page and its harness
  # typecheck, the bundle builds (it imports the extension's grammar from `editors/vscode`), and
  # node's test runner passes over the modules that need no browser (the grammar tokenizer, the
  # card canvas's model and layout, a run's history nested under its loops, the launcher's
  # reading of what `aip` prints). Its Playwright suite is the job below.
  console:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

  # The console's Playwright suite (C1's proof, `npm run typecheck && npm run e2e`): a real
  # `aip server` from this checkout on a Relate store, the console's launcher over this checkout's
  # `aip`, a decision model that answers from marks in the text (`console/e2e/model.mjs`), and
  # Chromium. It needs Relate, so like the bundle tests it runs only with `RELATE_GH_TOKEN`.
  console-e2e:
    name: Console e2e
    runs-on: ubuntu-latest
    env:
      RELATE_GH_TOKEN: ${{ secrets.RELATE_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install the package
        run: uv sync --group dev

      - name: Install Relate
        if: env.RELATE_GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.RELATE_GH_TOKEN }}
        run: scripts/install-relate.sh .venv

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        working-directory: console
        run: npm ci

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      - name: Install Chromium
        if: env.RELATE_GH_TOKEN != ''
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: The e2e suite
        if: env.RELATE_GH_TOKEN != ''
        working-directory: console
        run: npm run e2e
