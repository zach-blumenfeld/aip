[project]
name = "aip-spec"
version = "0.7.0"
description = "Agent Instruction Protocol: the procedure format, its validator, and the authoring skill"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/zach-blumenfeld/aip/tree/main/packages/aip-spec"
Runtime = "https://github.com/zach-blumenfeld/aip"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
aip-spec = "aip_spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_spec"]

# The authoring skill and the examples live once, at the repository root (`skills/aip-compile/`
# and `examples/`), where GitHub renders them and `aip skill install` finds them. The wheel
# carries the same files, under `aip_spec/_skill/` and `aip_spec/examples/`, so `aip-spec skill
# install` and `aip-spec example` work from an install (`aip_spec.resources` finds either copy).
# `hatch_build.py` adds them: from `../../` in the checkout, or from this package's root in an
# unpacked sdist, where the sdist force-include below has put them.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/aip_spec", "tests", "docs", "hatch_build.py", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"../../skills/aip-compile/SKILL.md" = "skills/aip-compile/SKILL.md"
"../../skills/aip-compile/references" = "skills/aip-compile/references"
"../../skills/aip-compile/assets" = "skills/aip-compile/assets"
"../../examples" = "examples"
