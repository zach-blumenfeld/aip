[project]
name = "aip-spec"
version = "0.6a1"
description = "Agent Instruction Protocol: the procedure format, its validator, and the authoring skill"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/zach-blumenfeld/aip-spec"
Runtime = "https://github.com/zach-blumenfeld/aip"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
aip-spec = "aip_spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_spec"]

# The authoring skill and the examples live once, at the repo root, where GitHub renders
# them and a clone is a skill. The wheel carries the same files so `aip-spec skill install`
# and `aip-spec example` work from an install (`aip_spec.resources` finds either copy).
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "aip_spec/_skill/SKILL.md"
"references" = "aip_spec/_skill/references"
"assets" = "aip_spec/_skill/assets"
"examples" = "aip_spec/examples"

[tool.hatch.build.targets.sdist]
include = ["src/aip_spec", "SKILL.md", "references", "assets", "examples", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
