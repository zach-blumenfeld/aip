# F1 spike only: a workspace member carrying a copy of the 0.6a1 `aip_spec` source so
# `aip --version` can import. F2 replaces this with the subtree of aip-spec.
[project]
name = "aip-spec"
version = "0.7.0.dev1"
description = "Agent Instruction Protocol: the procedure format and its validator (spike stub)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
]

[project.scripts]
aip-spec = "aip_spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip_spec"]
