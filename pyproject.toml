[project]
name = "agent-instruction-protocol"
version = "0.8.0"
description = "Agent Instruction Protocol: the procedure language and its compiler, the runtime, the server and the client, as one `aip` command"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
# Relate (`neo4j-cypherlite` 0.16.1 today, `relate-db` once renamed), the engine a bundle is
# written in, is deliberately not listed: it is not on PyPI and its GitHub release is internal,
# so `uv lock` could not fetch it and every `uv sync` would fail. `scripts/install-relate.sh`
# installs the pinned wheel; `aip/compiler/relate.py` imports it lazily and prints the hint when
# it is missing. When `relate-db` is on PyPI, pin it here and delete the script.
dependencies = [
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=6.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "neo4j>=6.0"]

[dependency-groups]
dev = ["pytest>=8", "neo4j>=6", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28"]

[project.scripts]
aip = "aip.client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]

# The example programs and the authoring skill live once, at the repository root (`examples/`
# and `skills/aip-compile/`), where GitHub renders them. The wheel carries the same files under
# `aip/compiler/examples/` and `aip/compiler/_skill/`, so an installed `aip` finds them
# (`aip.compiler.resources` looks in the wheel first, then walks up to the checkout). The sdist
# holds the whole tree, so a wheel built from it finds the same relative paths.
[tool.hatch.build.targets.wheel.force-include]
"examples" = "aip/compiler/examples"
"skills/aip-compile/SKILL.md" = "aip/compiler/_skill/SKILL.md"
"skills/aip-compile/references" = "aip/compiler/_skill/references"
"skills/aip-compile/assets" = "aip/compiler/_skill/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
