[project]
name = "aip"
version = "0.1.0"
description = "Agent Instruction Protocol: runtime model, server, and client for graph-shaped agent skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aip-spec @ git+https://github.com/zach-blumenfeld/aip-spec.git@v0.5a0",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=6.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "neo4j>=6", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28"]

[project.scripts]
aip = "aip.client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The `aip-spec` dependency is a git URL until both packages are on PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]

# Local work across the two checkouts (`../aip-spec` beside this repo): the format is edited
# there and seen here without reinstalling. The git pin in `dependencies` is the published
# truth; this override is what `uv sync` uses in this checkout and nowhere else.
[tool.uv.sources]
aip-spec = { path = "../aip-spec", editable = true }
