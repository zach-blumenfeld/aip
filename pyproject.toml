[project]
name = "agent-instruction-protocol"
version = "0.8.0"
description = "Agent Instruction Protocol: runtime model, server, and client for graph-shaped agent skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aip-spec==0.8.0",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=6.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "neo4j>=6.0"]

[dependency-groups]
dev = ["pytest>=8", "neo4j>=6", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28"]

[project.scripts]
aip = "aip.client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]

# `aip-spec` (the format: `packages/aip-spec/`) is a uv workspace member, so a checkout
# resolves it from the tree and `uv tool install git+...aip` installs it from the repo's
# subdirectory (spike F1, issue #17, uv 0.11.14). The pin is exact: both packages always
# share a version. A `../aip-spec` path source is not an option: uv applies a git-fetched
# project's sources when installing it, which broke `uv tool install`.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aip-spec = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/aip-spec/tests"]
