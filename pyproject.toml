[project]
name = "aip"
version = "0.6a1"
description = "Agent Instruction Protocol: runtime model, server, and client for graph-shaped agent skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aip-spec @ git+https://github.com/zach-blumenfeld/aip-spec.git@v0.6a1",
    "httpx>=0.28",
    "jsonschema>=4.26.0",
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=6.0"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "neo4j>=6.0"]

[dependency-groups]
dev = ["pytest>=8", "neo4j>=6", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28"]

[project.scripts]
aip = "aip.client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The `aip-spec` dependency is a git URL until both packages are on PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]

# No `[tool.uv.sources]` override for `aip-spec` here: uv applies a git-fetched project's
# sources when installing it, so a `../aip-spec` path broke `uv tool install git+...aip`.
# A uv *workspace member* does not have that problem. Spike F1 (issue #17, branch
# `spike/f1-workspace`, commit 41189db, uv 0.11.14): with `[tool.uv.workspace]
# members = ["packages/*"]` and `aip-spec = { workspace = true }`, `uv tool install --force
# "agent-instruction-protocol[server] @ git+https://github.com/zach-blumenfeld/aip.git@spike/f1-workspace"`
# into a fresh tool dir with an empty cache succeeded and installed aip-spec from the repo's
# `packages/aip-spec` subdirectory; `aip --version` printed the branch's version. F2 adopts
# that layout. For local work against a sibling checkout until then, layer it on per command:
#   uv run --with-editable ../aip-spec pytest -q
